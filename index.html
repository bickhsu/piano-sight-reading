<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f3ead7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="識譜"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><title>音感練習室 · 識譜反應訓練</title><style>
:root{
  --paper:#f3ead7;
  --sheet:#fbf7ef;
  --ink:#1c1915;
  --burgundy:#6e2c32;
  --sepia:#7a5b3a;
  --muted:#7a7166;
  --line:#d9cbb3;
  --serif:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,"Songti TC","PMingLiU","Times New Roman",serif;
  color:var(--ink);
  background:var(--paper);
  font-family:var(--serif);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    radial-gradient(rgba(62,44,22,.045) .65px,transparent .7px),
    radial-gradient(rgba(62,44,22,.03) .55px,transparent .6px);
  background-size:3px 3px,7px 7px;
  background-position:0 0,1px 2px;
}
button,input,select{font:inherit;color:inherit}
button,select,input{min-height:48px}
button{
  cursor:pointer;
  touch-action:manipulation;
  border:1px solid var(--ink);
  border-radius:12px;
  background:var(--sheet);
  padding:10px 16px;
}
button:hover{background:#f3e7d4}
button:disabled{opacity:.55;cursor:default}
button.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
button.primary:hover{background:#2a2420}
header{
  max-width:1100px;
  margin:auto;
  padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  border-bottom:1px solid var(--line);
  background:rgba(243,234,215,.92);
}
.brand{font-weight:700;font-size:22px;letter-spacing:.04em;line-height:1.1}
.brand small{font-size:11px;color:var(--sepia);display:block;letter-spacing:.22em;margin-top:4px;font-weight:600}
nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
nav button{background:transparent;border:0;border-radius:999px;color:var(--ink)}
nav button.active{background:#e7dcc6;color:var(--ink)}
#sound-toggle{flex:none;width:44px;height:44px;min-width:44px;min-height:44px;padding:0;border-radius:50%;border:1px solid var(--ink);display:inline-flex;align-items:center;justify-content:center}#sound-toggle svg{display:block}
#sound-toggle[aria-checked="true"]{background:#f8e7e4;border-color:var(--burgundy);color:var(--burgundy)}
#sound-toggle[aria-checked="false"]{background:#efe8da;border-color:#cbbfa8;color:var(--muted)}
#sound-toggle[aria-checked="true"]:hover{background:#f3d9d4}
#sound-toggle[aria-checked="false"]:hover{background:#e7decc}
.account-bar{max-width:1100px;margin:auto;padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}.import{position:relative;display:inline-flex;align-items:center;min-height:48px;padding:0 16px;border:1px solid var(--ink);border-radius:12px;background:var(--sheet);cursor:pointer}.import input{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;min-height:0}
main{max-width:1100px;margin:16px auto 12px;padding:0 20px}
main[hidden]{display:none!important}
.eyebrow{font-size:12px;letter-spacing:.22em;color:var(--sepia);font-weight:700}
h1,h2{font-family:var(--serif);font-weight:700;color:var(--ink)}
h1{font-size:34px;letter-spacing:.01em;margin:10px 0}
h2{font-size:18px;margin:0 0 16px}
p{color:#4e463d;line-height:1.7}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:22px;margin-top:22px}
.card{background:var(--sheet);border:1px solid #e4d8c2;border-radius:18px;padding:22px;box-shadow:0 1px 0 rgba(28,25,21,.04)}
.practice{padding:22px 26px 18px}
.row{display:flex;justify-content:flex-end;align-items:center;gap:12px;min-height:22px}#counter{font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--sepia);font-size:14px}
.tag{font-size:12px;padding:6px 10px;border-radius:999px;background:#efe4d2;color:var(--sepia);letter-spacing:.08em}
.progress{height:3px;background:#eadfcd;border-radius:9px;margin:12px 0}
.progress span{display:block;height:100%;background:var(--burgundy);border-radius:9px;transition:width .2s}
.score{width:100%;height:auto;max-height:210px;display:block;margin:4px 0 6px;background:transparent}
.staff-line,.ledger-line{stroke:var(--ink);stroke-width:1.6;shape-rendering:geometricPrecision}
.feedback{text-align:center;min-height:28px;color:var(--burgundy);font-size:15px;font-weight:700}
.hint{text-align:center;font-size:12px;margin:12px 0 0;color:var(--muted)}
.piano{
  --black-w:8.6%;
  position:relative;
  display:flex;
  align-items:stretch;
  width:100%;
  height:150px;
  min-height:120px;
  margin-top:8px;
  border:1px solid var(--ink);
  border-radius:12px;
  overflow:hidden;
  background:#f7f2e6;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}
.piano button[data-letter]{
  position:relative;
  z-index:1;
  flex:1 1 0;
  min-width:0;
  min-height:120px;
  height:auto;
  margin:0;
  padding:0 0 14px;
  border:0;
  border-right:1px solid var(--ink);
  border-radius:0;
  background:linear-gradient(#fffdf8,#f3ecdf);
  color:var(--ink);
  font-family:var(--serif);
  font-size:18px;
  font-weight:700;
  letter-spacing:.04em;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  touch-action:manipulation;
  box-shadow:inset 0 -6px 0 rgba(28,25,21,.06);
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}
.piano button[data-letter]:last-of-type{border-right:0}
.piano button[data-letter]:active,
.piano button[data-letter].is-down{
  background:#e6d8c2;
  box-shadow:inset 0 5px 10px rgba(28,25,21,.18);
  color:var(--burgundy);
}
.piano button[data-letter]:disabled{opacity:.72;color:#8d8376}
.black-key{
  position:absolute;
  z-index:2;
  top:0;
  left:calc(var(--i) * 100% / 7 - var(--black-w) / 2);
  width:var(--black-w);
  height:58%;
  border-radius:0 0 5px 5px;
  background:linear-gradient(#3a342e,#12100e 72%);
  box-shadow:inset -2px -4px 0 rgba(255,255,255,.06), 1px 2px 2px rgba(0,0,0,.28);
  pointer-events:auto;
}
label.field{display:block;font-size:13px;margin:16px 0;color:#51483f}
select,input[type=number]{display:block;width:100%;border:1px solid #d9cbb3;border-radius:10px;margin-top:8px;background:#fffdf8;padding:8px 12px}
.switch{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin:16px 0}
input[type=checkbox]{accent-color:var(--burgundy);width:20px;min-height:20px}
.aside-note{font-size:12px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted)}
.start{width:100%;margin-top:8px}
.footer{text-align:center;font-size:12px;color:var(--muted);margin:26px 0}
.hidden{display:none!important}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.metric{padding:16px;background:#f3ead8;border-radius:12px}
.metric strong{display:block;font-size:26px;margin:8px 0}
.metric small{color:var(--muted)}
.chart{width:100%;height:240px}
.legend{font-size:12px;color:var(--muted)}
.heat{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px;margin-bottom:20px}
.heat div{padding:12px 5px;text-align:center;border-radius:8px;font-size:12px;border:1px solid rgba(28,25,21,.06)}
.heat small{display:block;margin-top:5px;font-size:11px;white-space:nowrap}
.stats-actions{display:flex;gap:10px;margin:18px 0}
.empty{padding:28px;text-align:center;color:var(--muted)}
#settings-back{width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;margin-bottom:8px}
@media(max-width:800px){
  header{padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;gap:8px}
  .brand{font-size:16px}
  .brand small{font-size:9px;letter-spacing:.12em}
  nav button{white-space:nowrap;font-size:14px;padding:8px 10px}
  #sound-toggle{width:40px;height:40px;min-width:40px;min-height:40px}
  .account-bar{padding:8px 12px}
  main{padding:0 12px;margin-top:16px}
  h1{font-size:28px}
  .layout{grid-template-columns:1fr;gap:14px;margin-top:12px}
  .card{border-radius:14px}
  .practice{padding:14px 12px 12px}
  .score{max-height:210px}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .footer{margin:16px 0}
  .chart{height:200px}
  body.practicing{
    height:100dvh;
    max-height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  body.practicing header{flex:none}
  body.practicing .account-bar,
  body.practicing #settings-back,
  body.practicing .settings,
  body.practicing .footer,
  body.practicing #practice-view>.eyebrow,
  body.practicing #practice-view>h1,
  body.practicing #practice-view>p,
  body.practicing .hint{display:none!important}
  body.practicing main{
    flex:1 1 auto;
    min-height:0;
    margin:0;
    padding:0 8px;
    display:flex;
    flex-direction:column;
  }
  body.practicing #practice-view{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
  }
  body.practicing .layout{flex:1 1 auto;min-height:0;margin:0;display:flex}
  body.practicing .practice{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    padding:6px 4px 0;
    border:0;
    box-shadow:none;
    background:transparent;
  }
  body.practicing .progress{margin:6px 0}
  body.practicing .score{flex:1 1 auto;min-height:0;max-height:none;width:100%;margin:0}
  body.practicing .feedback{flex:none;min-height:22px;height:auto;font-size:14px}
  body.practicing .piano{
    flex:none;
    width:100vw;
    max-width:100vw;
    height:calc(132px + env(safe-area-inset-bottom,0px));
    min-height:calc(120px + env(safe-area-inset-bottom,0px));
    margin:0 0 0 calc(50% - 50vw);
    padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
    border-radius:0;
    border-left:0;
    border-right:0;
  }
}

.icon-btn{width:40px;height:40px;min-width:40px;min-height:40px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.icon-btn[aria-pressed="true"],#metro-toggle[aria-checked="true"],#sound-toggle[aria-checked="true"]{background:#f8e7e4;border-color:var(--burgundy);color:var(--burgundy)}
#metro-toggle[aria-checked="false"]{background:#efe8da;border-color:#cbbfa8;color:var(--muted)}
#mode,#count,#ledger,#naming,#counter,#progress,#feedback,#signout[hidden]{display:none!important}
.bpm{display:inline-flex;align-items:center;border:1px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--sheet);height:40px}
.bpm button{border:0;border-radius:0;min-height:40px;width:32px;padding:0;background:transparent}

.practice{position:relative}
.score{background:transparent}

.seg{display:flex;gap:6px}

.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
@font-face{font-family:Bravura;src:url("vendor/Bravura.woff2") format("woff2");font-display:block}
.brand{display:none}
header{flex-wrap:nowrap!important;align-items:center;justify-content:center;width:100%;margin:0;padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px;max-width:none}

.result-overlay[hidden]{display:none!important}
.result-card{position:relative;width:min(100%,300px);padding:36px 22px 22px;border-radius:22px;background:var(--sheet);text-align:center;box-shadow:0 16px 40px rgba(28,25,21,.18)}

#result-again{width:100%}
